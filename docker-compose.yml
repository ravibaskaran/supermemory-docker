# Local-test copy of the Coolify deployment.
# Coolify receives the same compose via MCP `service create` (auto-base64-encoded).
#
# Bring up locally with:
#   OPENAI_API_KEY=sk-... docker compose up -d
services:
  supermemory:
    image: ghcr.io/ravibaskaran/supermemory-server:latest
    container_name: supermemory
    restart: on-failure:5
    environment:
      - SUPERMEMORY_DATA_DIR=/data
      - PORT=6767
      - SUPERMEMORY_NO_PROMPT=1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - SUPERMEMORY_EMBEDDING_RAM_LIMIT=512mb
      - SUPERMEMORY_INGEST_CONCURRENCY=1
      - SUPERMEMORY_LOCAL_EMBEDDING_BATCH_SIZE=4
      - SUPERMEMORY_LOCAL_EMBEDDING_POOL_SIZE=1
      - SUPERMEMORY_LOCAL_EMBEDDING_WASM_THREADS=1
      - SUPERMEMORY_DISABLE_TELEMETRY=1
    volumes:
      - supermemory-data:/data
    ports:
      - "127.0.0.1:6767:6767"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:6767/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

volumes:
  supermemory-data:
